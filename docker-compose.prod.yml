services:
  astra3d:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: astra3d
    ports:
      - "3000:3000"
    volumes:
      # Host folders, not Docker volumes: photos and test cases stay on your
      # computer however the container is rebuilt or removed.
      - ./.astra3d-data:/app/.astra3d-data
      - ./test-cases:/app/test-cases
    environment:
      - NODE_ENV=production
      - ASTRA3D_DATA_DIR=/app/.astra3d-data
      - ASTRA3D_TEST_CASES_DIR=/app/test-cases
    restart: unless-stopped
